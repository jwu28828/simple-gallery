<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="一个轻盈的照片画廊，用网络图片链接展示那些值得留住的瞬间。">
  <title>片刻之间 · Simple Gallery</title>
  <style>
    :root{--ink:#252622;--muted:#777a75;--bg:#f7f6f2;--line:#e5e4df;--accent:#54776b}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    .wrap{max-width:1380px;margin:auto;padding:0 clamp(20px,5vw,76px)}
    .top{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-size:15px;letter-spacing:.07em;font-weight:650}
    .brand-mark{display:grid;place-items:center;width:33px;height:33px;border:1.5px solid var(--ink);border-radius:50%;font-size:19px;font-weight:400;line-height:1}
    .top-note{font-size:11px;letter-spacing:.22em;color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.4fr .6fr;align-items:end;gap:20px;padding:88px 0 64px}
    .eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
    .eyebrow:before{content:"";display:block;width:26px;height:1px;background:var(--accent)}
    h1{margin:21px 0 19px;font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(55px,8.3vw,124px);letter-spacing:-.06em;line-height:1.06;font-weight:500}
    .hero-sub{margin:0;color:#666b65;font-size:14px;line-height:2.1}
    .hero-aside{text-align:right;max-width:230px;justify-self:end;color:var(--muted);line-height:1.9;font-size:12px}
    .hero-aside .star{display:block;font-family:Georgia,serif;font-size:62px;color:#b6c8bd;line-height:1;margin-bottom:10px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 24px;border-top:1px solid var(--line)}
    .filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .filter{appearance:none;border:1px solid transparent;background:none;color:#858781;cursor:pointer;padding:10px 16px;border-radius:100px;font-size:12px;transition:.2s}
    .filter:hover{color:var(--ink)}
    .filter[aria-pressed="true"]{background:#273d35;color:#fff}
    .counter{font-size:11px;letter-spacing:.15em;color:var(--muted);white-space:nowrap}
    .gallery{columns:3;column-gap:20px;padding-bottom:74px}
    .photo{position:relative;display:block;width:100%;margin:0 0 20px;overflow:hidden;break-inside:avoid;border:0;border-radius:2px;padding:0;background:linear-gradient(135deg,#d7ded6,#b8c9c0);cursor:zoom-in;text-align:left}
    .photo img{display:block;width:100%;height:auto;aspect-ratio:var(--ratio);object-fit:cover;transition:transform .65s cubic-bezier(.2,.8,.2,1),filter .4s}
    .photo:hover img{transform:scale(1.045);filter:brightness(.82)}
    .photo:focus-visible,.filter:focus-visible,.lightbox button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .overlay{position:absolute;inset:auto 0 0;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45));padding:46px 18px 18px;display:flex;justify-content:space-between;align-items:end;gap:10px;opacity:0;transition:opacity .25s}
    .photo:hover .overlay,.photo:focus-visible .overlay{opacity:1}
    .photo-title{font-size:13px;font-weight:500;letter-spacing:.06em}
    .photo-index{font-size:11px;opacity:.85;letter-spacing:.12em}
    .photo[hidden]{display:none}
    .foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 0 45px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.1em}
    .lightbox{position:fixed;inset:0;z-index:10;background:rgba(19,24,22,.97);display:none;align-items:center;justify-content:center;padding:72px 78px}
    .lightbox.open{display:flex}
    .lightbox img{display:block;max-height:calc(100vh - 160px);max-width:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 18px 90px #0005}
    .lightbox button{position:absolute;display:grid;place-items:center;width:44px;height:44px;border:1px solid #ffffff36;background:#ffffff0d;border-radius:50%;color:white;cursor:pointer;font-size:23px}
    .lightbox button:hover{background:#ffffff26}
    .lightbox .close{right:26px;top:22px;font-size:25px}
    .lightbox .prev{left:20px;top:50%;transform:translateY(-50%)}
    .lightbox .next{right:20px;top:50%;transform:translateY(-50%)}
    .lightbox-caption{position:absolute;bottom:28px;color:#efefea;text-align:center;font-size:12px;letter-spacing:.12em}
    .lightbox-caption span{color:#a9b7af;margin-left:13px;font-size:11px}
    @media(max-width:850px){.hero{padding:70px 0 44px}.gallery{columns:2;column-gap:14px}.photo{margin-bottom:14px}}
    @media(max-width:560px){.top{height:70px}.top-note{font-size:9px}.hero{display:block;padding:56px 0 35px}.hero-aside{display:none}.hero-sub{font-size:12px}.toolbar{align-items:flex-start;gap:9px}.filter{padding:8px 12px;font-size:11px}.gallery{columns:2;column-gap:9px}.photo{margin-bottom:9px}.overlay{opacity:1;padding:30px 9px 9px}.photo-title{font-size:10px}.photo-index{display:none}.lightbox{padding:68px 15px}.lightbox img{max-height:calc(100vh - 180px)}.lightbox .prev{left:8px;bottom:21px;top:auto;transform:none}.lightbox .next{right:8px;bottom:21px;top:auto;transform:none}.lightbox .close{right:15px;top:15px}.foot{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./" aria-label="片刻之间，返回首页"><span class="brand-mark">✳</span> SIMPLE GALLERY</a>
      <div style="display:flex;align-items:center;gap:18px"><a href="./corridor-exhibition/" style="font-size:12px;text-decoration:none;color:#54776b;border-bottom:1px solid #a1b5a8;padding-bottom:4px">走廊展陈提案 ↗</a><span class="top-note">A VISUAL JOURNAL / 2026</span></div>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <div class="eyebrow">Collected moments</div>
          <h1 id="page-title">片刻之间<span style="color:#9bb5a7">.</span></h1>
          <p class="hero-sub">收集光、风、山海与街角的日常。<br>每一张照片，都是被留下的一瞬间。</p>
        </div>
        <div class="hero-aside"><span class="star">✳</span>一些不必急着讲完的故事。<br>Take a look. Stay a little.</div>
      </section>
      <section aria-label="照片画廊">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="筛选分类">
            <button class="filter" data-filter="all" aria-pressed="true">全部作品</button>
            <button class="filter" data-filter="nature" aria-pressed="false">自然风景</button>
            <button class="filter" data-filter="architecture" aria-pressed="false">建筑空间</button>
            <button class="filter" data-filter="city" aria-pressed="false">城市日常</button>
          </div>
          <span class="counter"><span id="count">0</span> PHOTOS</span>
        </div>
        <div class="gallery" id="gallery"></div>
      </section>
    </main>
    <footer class="foot"><span>© 2026 SIMPLE GALLERY</span><span>MADE FOR THE MOMENTS THAT MATTER.</span></footer>
  </div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图" aria-hidden="true">
    <button class="close" id="close" aria-label="关闭大图">×</button>
    <button class="prev" id="prev" aria-label="上一张">‹</button>
    <img id="lightbox-image" alt="">
    <button class="next" id="next" aria-label="下一张">›</button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
  <script>
    // 只需修改下方每项的 url，就能换成你自己的照片链接。
    const photos = [
      {title:"山间清晨",category:"nature",ratio:"4/5",url:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e"},
      {title:"光的方向",category:"architecture",ratio:"4/3",url:"https://images.unsplash.com/photo-1487958449943-2429e8be8625"},
      {title:"海岸线",category:"nature",ratio:"3/4",url:"https://images.unsplash.com/photo-1518837695005-2083093ee35b"},
      {title:"慢下来",category:"city",ratio:"4/5",url:"https://images.unsplash.com/photo-1497366811353-6870744d04b2"},
      {title:"山的轮廓",category:"nature",ratio:"3/4",url:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"},
      {title:"几何诗篇",category:"architecture",ratio:"4/5",url:"https://images.unsplash.com/photo-1511818966892-d7d671e672a2"},
      {title:"野外来信",category:"nature",ratio:"4/3",url:"https://images.unsplash.com/photo-1500534623283-312aade485b7"},
      {title:"城市切片",category:"city",ratio:"3/4",url:"https://images.unsplash.com/photo-1519501025264-65ba15a82390"},
      {title:"湖光",category:"nature",ratio:"4/5",url:"https://images.unsplash.com/photo-1501785888041-af3ef285b470"},
      {title:"午后空间",category:"architecture",ratio:"4/3",url:"https://images.unsplash.com/photo-1524230572899-a752b3835840"},
      {title:"途经此处",category:"city",ratio:"4/5",url:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b"},
      {title:"森林深处",category:"nature",ratio:"3/4",url:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e"},
      {title:"雪山与星",category:"nature",ratio:"4/5",url:"https://images.unsplash.com/photo-1519681393784-d120267933ba"},
      {title:"天空下的建筑",category:"architecture",ratio:"3/4",url:"https://images.unsplash.com/photo-1497366754035-f200968a6e72"},
      {title:"夜色初上",category:"city",ratio:"4/3",url:"https://images.unsplash.com/photo-1514565131-fce0801e5785"}
    ];
    const gallery=document.getElementById("gallery");
    const count=document.getElementById("count");
    const modal=document.getElementById("lightbox");
    const modalImage=document.getElementById("lightbox-image");
    const modalCaption=document.getElementById("lightbox-caption");
    let filter="all", current=0, visible=photos.map((_,i)=>i), lastFocus=null;

    function imageUrl(photo,width){return photo.url+"?auto=format&fit=crop&w="+width+"&q=85";}
    photos.forEach((photo,i)=>{
      const item=document.createElement("button");
      item.type="button";item.className="photo";item.dataset.category=photo.category;
      item.style.setProperty("--ratio",photo.ratio);
      item.setAttribute("aria-label","查看照片："+photo.title);
      const img=document.createElement("img");
      img.src=imageUrl(photo,1000);img.alt=photo.title;img.loading=i<4?"eager":"lazy";img.decoding="async";
      img.onerror=()=>{img.style.opacity="0";item.style.minHeight="220px";};
      const overlay=document.createElement("span");overlay.className="overlay";
      const title=document.createElement("span");title.className="photo-title";title.textContent=photo.title;
      const idx=document.createElement("span");idx.className="photo-index";idx.textContent=String(i+1).padStart(2,"0");
      overlay.append(title,idx);item.append(img,overlay);
      item.addEventListener("click",()=>openImage(i));gallery.append(item);
    });
    function applyFilter(value){
      filter=value;visible=[];
      [...gallery.children].forEach((item,i)=>{
        const show=value==="all"||photos[i].category===value;
        item.hidden=!show;if(show)visible.push(i);
      });
      count.textContent=String(visible.length).padStart(2,"0");
      document.querySelectorAll(".filter").forEach(btn=>btn.setAttribute("aria-pressed",String(btn.dataset.filter===value)));
    }
    document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>applyFilter(btn.dataset.filter)));
    function showImage(index){
      current=index;modalImage.src=imageUrl(photos[current],1800);modalImage.alt=photos[current].title;
      modalCaption.replaceChildren();
      modalCaption.append(document.createTextNode(photos[current].title));
      const detail=document.createElement("span");detail.textContent=(visible.indexOf(current)+1)+" / "+visible.length;modalCaption.append(detail);
    }
    function openImage(index){
      lastFocus=document.activeElement;showImage(index);modal.classList.add("open");modal.setAttribute("aria-hidden","false");
      document.body.style.overflow="hidden";document.getElementById("close").focus();
    }
    function closeImage(){
      modal.classList.remove("open");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";
      modalImage.removeAttribute("src");if(lastFocus)lastFocus.focus();
    }
    function move(step){let pos=visible.indexOf(current);showImage(visible[(pos+step+visible.length)%visible.length]);}
    document.getElementById("close").addEventListener("click",closeImage);
    document.getElementById("prev").addEventListener("click",()=>move(-1));
    document.getElementById("next").addEventListener("click",()=>move(1));
    modal.addEventListener("click",e=>{if(e.target===modal)closeImage();});
    document.addEventListener("keydown",e=>{
      if(!modal.classList.contains("open"))return;
      if(e.key==="Escape")closeImage();
      else if(e.key==="ArrowRight")move(1);
      else if(e.key==="ArrowLeft")move(-1);
      else if(e.key==="Tab"){
        const controls=[...modal.querySelectorAll("button")];const first=controls[0],last=controls[controls.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    });
    applyFilter("all");
  </script>
</body>
</html>
